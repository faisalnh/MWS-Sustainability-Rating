<style>
    :root {
        --c-primary: #7d9b76;
        --c-primary-hover: #64805f;
        --c-primary-light: #a8bea2;
        --c-primary-soft: #edf4ea;
        --c-primary-wash: #f7fbf5;
        --c-cream: #f7f1e6;
        --c-sky: #88c8d8;
        --c-gold: #dcbf65;
        --c-bg: #f6f8f2;
        --c-card: #fffef9;
        --c-text: #273127;
        --c-text-secondary: #667064;
        --c-text-muted: #90998e;
        --c-border: #dfe8d9;
        --shadow: 0 16px 40px rgba(78, 101, 72, 0.12);
        --shadow-soft: 0 8px 24px rgba(78, 101, 72, 0.08);
        --radius: 20px;
        --transition-speed: 0.25s;

        /* Legacy aliases kept for existing markup */
        --mw-primary: var(--c-primary);
        --mw-primary-dark: var(--c-primary-hover);
        --mw-accent: var(--c-gold);
        --mw-bg: var(--c-bg);
        --mw-card: var(--c-card);
        --mw-border: var(--c-border);
        --mw-text: var(--c-text);
        --mw-muted: var(--c-text-secondary);
        --mw-danger: #b42318;
        --mw-warning: #9a6700;
        --mw-success: #3f7656;
    }

    * {
        box-sizing: border-box;
    }
    body {
        margin: 0;
        font-family: "Inter", "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        color: var(--c-text);
        background:
            radial-gradient(
                circle at top left,
                rgba(168, 190, 162, 0.32),
                transparent 34rem
            ),
            linear-gradient(180deg, #fbfcf7 0%, var(--c-bg) 46%, #f0f5ec 100%);
        line-height: 1.5;
        min-height: 100vh;
    }
    a {
        color: var(--c-primary);
    }

    /* Top bar */
    .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        padding: 14px 24px;
        background: rgba(255, 254, 249, 0.88);
        border-bottom: 1px solid rgba(125, 155, 118, 0.18);
        position: sticky;
        top: 0;
        z-index: 2;
        box-shadow: var(--shadow-soft);
        backdrop-filter: blur(16px);
    }
    .brand {
        display: flex;
        gap: 10px;
        align-items: baseline;
        flex-wrap: wrap;
    }
    .brand strong {
        color: var(--c-primary-hover);
        font-size: 1.05rem;
    }
    .brand span {
        color: var(--c-text-muted);
        font-size: 13px;
    }
    nav {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
    }
    nav a {
        text-decoration: none;
        font-size: 13px;
        font-weight: 700;
        color: var(--c-primary-hover);
        padding: 8px 12px;
        border-radius: 999px;
        transition:
            background var(--transition-speed) ease,
            color var(--transition-speed) ease;
    }
    nav a:hover {
        background: var(--c-primary-soft);
        color: var(--c-primary-hover);
    }

    .container {
        max-width: 1280px;
        margin: 0 auto;
        padding: 32px 16px 64px;
    }

    .card {
        background: rgba(255, 254, 249, 0.94);
        border: 1px solid rgba(125, 155, 118, 0.18);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 24px;
        margin-bottom: 20px;
        backdrop-filter: blur(10px);
    }
    .hero {
        position: relative;
        overflow: hidden;
        padding: 42px;
        background:
            linear-gradient(
                135deg,
                rgba(255, 254, 249, 0.96),
                rgba(237, 244, 234, 0.94)
            ),
            radial-gradient(
                circle at 92% 10%,
                rgba(125, 155, 118, 0.26),
                transparent 18rem
            );
    }
    .hero::after {
        content: "";
        position: absolute;
        right: -70px;
        bottom: -90px;
        width: 240px;
        height: 240px;
        border-radius: 999px;
        background: rgba(168, 190, 162, 0.26);
        pointer-events: none;
    }

    .eyebrow {
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 12px;
        font-weight: 700;
        color: var(--c-primary-hover);
        margin: 0 0 8px;
    }
    h1,
    h2,
    h3,
    h4 {
        margin-top: 0;
        color: var(--c-text);
        font-weight: 600;
    }
    h1 {
        color: var(--c-primary-hover);
        letter-spacing: -0.035em;
    }
    h2 {
        color: var(--c-primary-hover);
        letter-spacing: -0.02em;
    }
    h3 {
        color: var(--c-primary-hover);
    }
    h4 {
        color: var(--c-primary-light);
        font-size: 16px;
    }
    .lead {
        color: var(--c-text-secondary);
        font-size: 16px;
        max-width: 820px;
    }

    .grid {
        display: grid;
        gap: 18px;
    }
    .grid.two {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .feature-card {
        position: relative;
        overflow: hidden;
    }
    .feature-card::before {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: 5px;
        background: var(--c-primary-light);
    }
    .feature-card h2 {
        display: flex;
        align-items: center;
        gap: 10px;
    }
    .feature-icon {
        display: inline-grid;
        place-items: center;
        width: 36px;
        height: 36px;
        border-radius: 12px;
        background: var(--c-primary-soft);
        color: var(--c-primary-hover);
        font-size: 18px;
    }
    .band-list {
        display: grid;
        gap: 8px;
    }
    .band-row {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--c-text-secondary);
    }

    .actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 18px;
    }

    /* Buttons */
    .button,
    button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border: 1px solid rgba(125, 155, 118, 0.28);
        border-radius: 999px;
        background: rgba(255, 254, 249, 0.9);
        color: var(--c-primary-hover);
        padding: 11px 18px;
        font-weight: 700;
        text-decoration: none;
        cursor: pointer;
        min-height: 40px;
        transition: all var(--transition-speed) ease;
    }
    .button:hover,
    button:hover:not(:disabled) {
        background: var(--c-primary-soft);
        border-color: var(--c-primary-light);
        transform: translateY(-1px);
        box-shadow: var(--shadow-soft);
    }
    .button.primary,
    button.primary {
        background: var(--c-primary);
        color: #fff;
        border-color: var(--c-primary);
        box-shadow: 0 10px 24px rgba(100, 128, 95, 0.24);
    }
    .button.primary:hover,
    button.primary:hover:not(:disabled) {
        background: var(--c-primary-hover);
        border-color: var(--c-primary-hover);
        color: #fff;
        box-shadow: 0 12px 28px rgba(100, 128, 95, 0.28);
    }
    button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
        transform: none;
    }

    /* Forms */
    label {
        display: block;
        font-weight: 600;
        margin-bottom: 6px;
        color: var(--c-text);
    }
    input,
    select,
    textarea {
        width: 100%;
        border: 1px solid var(--c-border);
        border-radius: 14px;
        padding: 11px 13px;
        font: inherit;
        background: rgba(255, 254, 249, 0.96);
        transition: all var(--transition-speed) ease;
    }
    input:focus,
    select:focus,
    textarea:focus {
        outline: none;
        border-color: var(--c-primary);
        box-shadow: 0 0 0 4px rgba(125, 155, 118, 0.16);
    }
    textarea {
        min-height: 74px;
        resize: vertical;
        line-height: 1.5;
    }

    .helper,
    .muted {
        color: var(--c-text-secondary);
        font-size: 13px;
    }

    .form-row {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
        margin-bottom: 14px;
    }

    /* Indicator cards */
    .indicator {
        border: 1px solid rgba(125, 155, 118, 0.2);
        border-radius: 18px;
        padding: 18px;
        margin: 14px 0;
        background: var(--c-primary-wash);
        transition:
            border-color var(--transition-speed) ease,
            box-shadow var(--transition-speed) ease;
    }
    .indicator:hover {
        border-color: var(--c-primary-light);
        box-shadow: var(--shadow-soft);
    }
    .indicator header {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: flex-start;
    }
    .indicator h3 {
        margin-bottom: 6px;
    }
    .weight {
        color: var(--c-primary-hover);
        background: var(--c-primary-soft);
        padding: 4px 10px;
        border-radius: 999px;
        font-weight: 700;
        white-space: nowrap;
        font-size: 13px;
    }
    .score-help {
        margin: 8px 0;
        padding-left: 18px;
        color: var(--c-text-secondary);
        font-size: 13px;
    }
    .evidence-warning {
        color: var(--mw-warning);
        font-size: 13px;
        display: none;
        margin-top: 6px;
    }
    .water-disabled {
        opacity: 0.5;
        display: none;
    }

    /* Preview footer */
    .preview {
        position: sticky;
        bottom: 12px;
        z-index: 1;
        border: 1px solid var(--c-border);
        background: rgba(255, 254, 249, 0.92);
        backdrop-filter: blur(14px);
        border-radius: 18px;
        padding: 14px 18px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        box-shadow: 0 14px 34px rgba(78, 101, 72, 0.14);
    }

    /* Chips */
    .chip {
        display: inline-flex;
        align-items: center;
        border-radius: 999px;
        padding: 4px 10px;
        font-size: 12px;
        font-weight: 800;
        border: 1px solid transparent;
        letter-spacing: 0.3px;
    }
    .rating-s {
        background: #e9f7ef;
        color: #096b3a;
    }
    .rating-a {
        background: #edf7ff;
        color: #145a8a;
    }
    .rating-b {
        background: #fff8df;
        color: #805600;
    }
    .rating-c {
        background: #fff0df;
        color: #934b00;
    }
    .rating-d,
    .rating-revision {
        background: #fff0f0;
        color: var(--c-primary);
    }
    .status-ok {
        background: #e9f7ef;
        color: #1f7a4d;
    }
    .status-cap {
        background: #fff8df;
        color: var(--mw-warning);
    }
    .status-error {
        background: #fff0f0;
        color: var(--c-primary);
    }

    /* Inserted rating display (web view, mirrors doc styling) */
    .inserted-rating {
        font-weight: 700;
    }
    .inserted-rating .rating-letter {
        font-weight: 800;
        letter-spacing: 0.5px;
    }
    .inserted-rating .rating-letter.r-s {
        color: #096b3a;
    }
    .inserted-rating .rating-letter.r-a {
        color: #145a8a;
    }
    .inserted-rating .rating-letter.r-b {
        color: #805600;
    }
    .inserted-rating .rating-letter.r-c {
        color: #934b00;
    }
    .inserted-rating .rating-letter.r-d {
        color: var(--c-primary);
    }
    .inserted-rating .rating-score {
        font-weight: 400;
        color: var(--c-text);
    }
    .inserted-rating .rating-link {
        font-weight: 400;
    }

    /* Tables */
    .table-wrap {
        overflow-x: auto;
        border-radius: var(--radius);
    }
    table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
    }
    th,
    td {
        border-bottom: 1px solid var(--c-border);
        padding: 10px 12px;
        text-align: left;
        vertical-align: top;
    }
    th {
        color: var(--c-text-secondary);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        background: var(--c-bg);
    }
    tbody tr:hover {
        background: rgba(125, 155, 118, 0.06);
    }

    /* Alerts */
    .alert {
        border-radius: 16px;
        padding: 12px 14px;
        margin: 12px 0;
        background: #fff8df;
        color: var(--mw-warning);
        border: 1px solid #f2d37d;
    }
    .alert.error {
        background: #fff0f0;
        color: var(--c-primary);
        border-color: #fac5c0;
    }
    .alert.success {
        background: #e9f7ef;
        color: var(--mw-success);
        border-color: #b6e2c7;
    }
    .alert.info {
        background: rgba(136, 200, 216, 0.12);
        color: #14506a;
        border-color: rgba(136, 200, 216, 0.42);
        border-left: 4px solid var(--c-sky);
    }

    .loading {
        color: var(--c-text-muted);
    }

    /* Latest assessments list */
    .latest-list {
        display: grid;
        gap: 12px;
    }
    .latest-item {
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 14px;
        align-items: center;
        padding: 14px 16px;
        border: 1px solid var(--c-border);
        border-radius: var(--radius);
        background: rgba(255, 254, 249, 0.86);
        transition: all var(--transition-speed) ease;
    }
    .latest-item:hover {
        border-color: var(--c-primary-light);
        box-shadow: var(--shadow-soft);
        transform: translateY(-1px);
    }
    .latest-item .meta {
        color: var(--c-text-secondary);
        font-size: 13px;
        margin-top: 2px;
    }
    .latest-item .title {
        font-weight: 700;
        color: var(--c-text);
    }
    .latest-item .rating-pill {
        font-weight: 800;
        padding: 6px 12px;
        border-radius: 999px;
        font-size: 13px;
    }
    .latest-actions {
        display: flex;
        gap: 8px;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
    }
    ::-webkit-scrollbar-track {
        background: var(--c-bg);
        border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb {
        background: var(--c-primary-light);
        border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
        background: var(--c-primary);
    }

    @media (max-width: 760px) {
        .topbar {
            align-items: flex-start;
            flex-direction: column;
        }
        .grid.two,
        .form-row {
            grid-template-columns: 1fr;
        }
        .hero {
            padding: 28px;
        }
        .preview {
            flex-direction: column;
            align-items: stretch;
        }
        .latest-item {
            grid-template-columns: 1fr;
        }
    }
</style>
