<style>
:root{--mw-primary:#246b5a;--mw-primary-dark:#16483d;--mw-accent:#d9a441;--mw-bg:#f6f7f5;--mw-card:#ffffff;--mw-border:#dde4df;--mw-text:#18231f;--mw-muted:#66736e;--mw-danger:#b42318;--mw-warning:#a15c07;--mw-success:#1f7a4d}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--mw-text);background:var(--mw-bg);line-height:1.45}a{color:var(--mw-primary)}.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 24px;background:var(--mw-card);border-bottom:1px solid var(--mw-border);position:sticky;top:0;z-index:2}.brand{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}.brand span{color:var(--mw-muted);font-size:13px}nav{display:flex;gap:12px;flex-wrap:wrap}nav a{text-decoration:none;font-size:13px;font-weight:700}.container{max-width:1040px;margin:0 auto;padding:26px 16px 54px}.card{background:var(--mw-card);border:1px solid var(--mw-border);border-radius:16px;box-shadow:0 6px 18px rgba(15,35,28,.06);padding:22px;margin-bottom:18px}.hero{padding:30px}.eyebrow{text-transform:uppercase;letter-spacing:.08em;font-size:12px;font-weight:700;color:var(--mw-primary);margin:0 0 8px}h1,h2,h3{margin-top:0;color:var(--mw-text)}.lead{color:var(--mw-muted);font-size:16px;max-width:820px}.grid{display:grid;gap:18px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}.button,button{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--mw-border);border-radius:10px;background:#fff;color:var(--mw-primary-dark);padding:10px 14px;font-weight:700;text-decoration:none;cursor:pointer;min-height:40px}.button.primary,button.primary{background:var(--mw-primary);color:#fff;border-color:var(--mw-primary)}button:disabled{opacity:.55;cursor:wait}label{display:block;font-weight:700;margin-bottom:6px}input,select,textarea{width:100%;border:1px solid var(--mw-border);border-radius:10px;padding:10px;font:inherit;background:#fff}textarea{min-height:74px;resize:vertical}.helper,.muted{color:var(--mw-muted);font-size:13px}.form-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:14px}.indicator{border:1px solid var(--mw-border);border-radius:14px;padding:16px;margin:12px 0;background:#fbfcfb}.indicator header{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.indicator h3{margin-bottom:6px}.weight{color:var(--mw-muted);font-weight:700;white-space:nowrap}.score-help{margin:8px 0;padding-left:18px;color:var(--mw-muted);font-size:13px}.evidence-warning{color:var(--mw-warning);font-size:13px;display:none;margin-top:6px}.water-disabled{opacity:.5;display:none}.preview{position:sticky;bottom:12px;z-index:1;border:1px solid var(--mw-border);background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-radius:14px;padding:14px;display:flex;justify-content:space-between;align-items:center;gap:12px;box-shadow:0 8px 20px rgba(0,0,0,.08)}.chip{display:inline-flex;align-items:center;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:800;border:1px solid transparent}.rating-s{background:#e9f7ef;color:#096b3a}.rating-a{background:#edf7ff;color:#145a8a}.rating-b{background:#fff8df;color:#805600}.rating-c{background:#fff0df;color:#934b00}.rating-d,.rating-revision{background:#fff0f0;color:var(--mw-danger)}.status-ok{background:#e9f7ef;color:var(--mw-success)}.status-cap{background:#fff8df;color:var(--mw-warning)}.status-error{background:#fff0f0;color:var(--mw-danger)}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{border-bottom:1px solid var(--mw-border);padding:10px;text-align:left;vertical-align:top}th{color:var(--mw-muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}.alert{border-radius:12px;padding:12px 14px;margin:12px 0;background:#fff8df;color:var(--mw-warning);border:1px solid #f2d37d}.alert.error{background:#fff0f0;color:var(--mw-danger);border-color:#fac5c0}.
